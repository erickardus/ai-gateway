name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # The rstate tests exercise Lua atomicity and expiry semantics against a real
    # server. They skip themselves when redis-server is absent, so CI installs it
    # rather than quietly running a smaller suite than it appears to.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-server for integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The admin console is typechecked and built here rather than only in the
      # Docker image, so a broken front end fails the same push a broken
      # handler would. The Go build embeds whatever this produces.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the admin UI
        run: make ui

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Fuzz the JSON splicer briefly
        run: go test ./internal/jsonx -run Fuzz -fuzz FuzzSetTopLevelString -fuzztime 30s

      - name: Fuzz the JSON editors briefly
        run: go test ./internal/jsonx -run Fuzz -fuzz FuzzEdit -fuzztime 30s

      # The prompt-cache path is where a bad input becomes a wrong bill rather
      # than a failed request, so its four fuzz targets run on every push: the
      # breakpoint detector, the breakpoint stripper that decides which requests
      # share a pin, the body rewriter, and the usage parser that turns a
      # provider's counters into money.
      - name: Fuzz the breakpoint detector briefly
        run: go test ./internal/jsonx -run Fuzz -fuzz FuzzContainsObjectKey -fuzztime 30s

      - name: Fuzz the breakpoint stripper briefly
        run: go test ./internal/jsonx -run Fuzz -fuzz FuzzStripObjectKey -fuzztime 30s

      - name: Fuzz breakpoint injection briefly
        run: go test ./internal/promptcache -run Fuzz -fuzz FuzzInject -fuzztime 30s

      - name: Fuzz usage accounting briefly
        run: go test ./internal/provider -run Fuzz -fuzz FuzzUsageAccounting -fuzztime 30s
