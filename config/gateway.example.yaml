# ai-gateway example configuration.
#
# Copy to config/gateway.yaml and edit. Every ${VAR} is read from the
# environment at load time; ${VAR:-default} supplies a fallback.

server:
  addr: "0.0.0.0:4000"
  read_header_timeout: 30s
  idle_timeout: 120s
  shutdown_grace: 30s
  max_body_bytes: 33554432
  # Note: there is deliberately no write timeout. A write deadline applies to
  # the whole response, so any value large enough for a long streaming
  # completion protects nothing, and any smaller value severs streams.

# A model_list entry is one deployment. Several entries may share a model_name;
# together they form a model group that the router load-balances across.
model_list:
  # Deployment 1 — the Claude Code subscription path.
  #
  # auth_mode: passthrough relays the CALLER's own credential upstream. That is
  # what lets Claude Code keep using a claude.ai subscription login while its
  # traffic flows through this gateway: the OAuth token in Authorization reaches
  # Anthropic untouched, and the gateway authenticates the caller from the
  # separate x-gateway-key header instead. The gateway holds no credential of
  # its own here, so api_key must be empty.
  - model_name: anthropic-claude
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      # Keep this equal to model_name and request bodies are forwarded byte for
      # byte. Set it to a different upstream identifier and the gateway rewrites
      # exactly that one JSON value, leaving every other byte untouched.
      model: anthropic-claude
      auth_mode: passthrough
    weight: 10
    rpm: 1000
    # No `cost` here, and none is allowed: a passthrough deployment bills the
    # caller's own subscription, so pricing it would invent a charge the
    # operator never receives. Its traffic is reported as usage with no cost.

  # Deployment 2 — same public name, but billed to a server-side API key.
  # Requests overflow here when deployment 1 is rate limited or ejected.
  - model_name: anthropic-claude
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      model: claude-sonnet-4-5-20250929
      auth_mode: api_key
      auth_header: x-api-key
      api_key: ${ANTHROPIC_API_KEY}
    weight: 1
    rpm: 500
    # Priced per million tokens, as providers publish it. The cache figures
    # matter: Claude Code leans on prompt caching, and a cache read costs about
    # a tenth of ordinary input, so a cost model without them is badly wrong.
    cost:
      input_per_1m: 3.00
      output_per_1m: 15.00
      cache_read_per_1m: 0.30
      cache_write_per_1m: 3.75

  # A cheaper group to fall back to.
  - model_name: anthropic-claude-haiku
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      model: claude-haiku-4-5-20251001
      auth_mode: api_key
      auth_header: x-api-key
      api_key: ${ANTHROPIC_API_KEY}
    weight: 1
    cost:
      input_per_1m: 1.00
      output_per_1m: 5.00
      cache_read_per_1m: 0.10
      cache_write_per_1m: 1.25

  # An OpenAI-format deployment, reachable at /v1/chat/completions. There is no
  # cross-format translation: an Anthropic ingress routes only to anthropic
  # deployments, and an OpenAI ingress only to openai ones.
  - model_name: gpt
    params:
      format: openai
      api_base: https://api.openai.com/v1
      model: gpt-5
      auth_mode: api_key
      auth_header: authorization
      auth_scheme: Bearer
      api_key: ${OPENAI_API_KEY}
    weight: 1

router:
  # weighted-shuffle | least-busy | usage-based | latency-based
  strategy: weighted-shuffle

  # Total upstream attempts is 1 + num_retries. A retry always moves to a
  # different deployment while an untried one is available.
  num_retries: 2

  timeout: 600s
  # For streaming requests this bounds time to the first chunk, not the whole
  # response, which may legitimately run for minutes.
  stream_timeout: 60s

  cooldown:
    # Failures tolerated within the period before a deployment is ejected.
    # 0 means eject on the first failure; the value always means what it says.
    allowed_fails: 3
    period: 30s

  # Backoff applies only when no untried deployment remains. With an
  # alternative available the router retries immediately.
  backoff:
    initial: 500ms
    max: 8s
    jitter: 0.75

  max_fallback_hops: 5
  fallbacks:
    - from: anthropic-claude
      to: [anthropic-claude-haiku]

  # Used by latency-based routing: widens the candidate set to every deployment
  # within this fraction of the best observed latency.
  lowest_latency_buffer: 0.2

virtual_keys:
  # Enables the /key/* management endpoints. Leave unset to disable them.
  master_key: ${GATEWAY_MASTER_KEY}

  store:
    # memory | file
    kind: file
    path: ./data/keys.json

  # Headers that may carry a virtual key, in precedence order. These must not
  # collide with a header the client sets itself: the whole design depends on
  # the key travelling ALONGSIDE the caller's own credential rather than
  # replacing it. x-litellm-api-key is accepted for drop-in compatibility with
  # tooling already pointed at a LiteLLM proxy.
  header_names:
    - x-gateway-key
    - x-litellm-api-key

  # A passthrough deployment relays a caller credential, so its upstream host
  # must be listed here explicitly.
  allowed_upstream_hosts:
    - api.anthropic.com

  keys:
    - key: ${DEV_KEY}
      alias: dev-laptop
      models: ["anthropic-claude", "anthropic-claude-haiku"]
      rpm_limit: 200
      tpm_limit: 400000
      # Spend cap for the window below. Only billable traffic counts, so
      # subscription passthrough never consumes it.
      max_budget: 50.0
      budget_duration: 720h
      # Required before this key may reach a passthrough deployment.
      allow_passthrough: true

# Share state across gateway instances. Without this every replica enforces its
# own limits, so a rate limit is silently multiplied by the replica count and a
# key can spend its whole budget once per instance.
#
# Rate limits, cooldowns and spend go to Redis because they must be global to be
# correct. Latency and in-flight stay per-instance by design: latency measures
# this instance's own network path to the upstream, and a shared in-flight
# counter would leak permanently whenever an instance died mid-request.
#
# If Redis becomes unreachable the gateway keeps serving with per-instance
# limits rather than failing requests, and says so loudly in the logs and on
# /health/readiness.
# redis:
#   addr: localhost:6379
#   key_prefix: ai-gateway
#   timeout: 250ms

# Serve an identical request from a stored response instead of calling the
# provider again.
#
# scope decides who may see a cached response, and the default is deliberate.
# "key" confines each virtual key to its own responses: it cannot leak one
# caller's completion to another. "shared" lets every caller reuse any cached
# response — far larger savings, but only appropriate when all callers are
# equally trusted, and refused outright while any passthrough deployment exists,
# since those responses are generated under one person's own subscription.
# cache:
#   enabled: true
#   ttl: 5m
#   scope: key            # key | shared
#   max_entries: 1000
#   max_entry_bytes: 1048576
#   shared: false         # store in Redis so a hit on one instance serves all

# The provider's own prompt cache — the one Anthropic keeps of a request's
# leading tokens — as distinct from the response cache above.
#
# affinity is the part that matters behind a load balancer. A prompt cache lives
# on one upstream account, so spreading a conversation's turns across
# deployments turns every cache read into a cache write: a premium instead of a
# discount. Affinity pins requests that share a cacheable prefix to the
# deployment that last served one. It is a preference, never a constraint — a
# pinned deployment that is cooling down or at its rate limit is passed over as
# if there were no pin — and it does nothing at all in a group with a single
# deployment. On by default.
#
# inject places cache breakpoints on the stable prefix of an Anthropic request —
# the tools and the system prompt — for callers that do not place their own.
# Off by default, and refused at load while any passthrough deployment is
# configured: injection edits the request body, and the passthrough path exists
# to forward one unchanged. Claude Code places its own breakpoints, so a body
# that already carries one is never touched.
prompt_cache:
  affinity: true
  affinity_ttl: 5m
  # Bounds how far a pin may concentrate load: it is passed over once the pinned
  # deployment carries this many more in-flight requests than the idlest
  # deployment that could serve the request instead. A load comparison rather
  # than a share quota, because concentration only hurts when there is
  # contention — one busy conversation among idle peers is the feature working.
  # 0 yields to any idler peer.
  affinity_max_in_flight_lead: 4
  inject: false
  # Prefixes smaller than this are left unmarked. Anthropic ignores a breakpoint
  # below its own minimum rather than rejecting it, so this is an economy rather
  # than a correctness rule.
  inject_min_bytes: 4096

observability:
  log_level: info
  # text | json
  log_format: text

  # Serve GET /metrics in the Prometheus text format. Unauthenticated, like the
  # liveness probe, but exposes only counters — no hostnames or auth modes.
  metrics: true

  # Persist the spend ledger so budgets survive a restart. Without it every
  # restart hands each key a fresh allowance.
  spend_store_path: ./data/spend.json
  spend_flush_interval: 30s
