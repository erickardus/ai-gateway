# ai-gateway example configuration.
#
# Copy to config/gateway.yaml and edit. Every ${VAR} is read from the
# environment at load time; ${VAR:-default} supplies a fallback.

server:
  addr: "0.0.0.0:4000"
  read_header_timeout: 30s
  idle_timeout: 120s
  shutdown_grace: 30s
  max_body_bytes: 33554432
  # Note: there is deliberately no write timeout. A write deadline applies to
  # the whole response, so any value large enough for a long streaming
  # completion protects nothing, and any smaller value severs streams.

# A model_list entry is one deployment. Several entries may share a model_name;
# together they form a model group that the router load-balances across.
model_list:
  # Deployment 1 — the Claude Code subscription path.
  #
  # auth_mode: passthrough relays the CALLER's own credential upstream. That is
  # what lets Claude Code keep using a claude.ai subscription login while its
  # traffic flows through this gateway: the OAuth token in Authorization reaches
  # Anthropic untouched, and the gateway authenticates the caller from the
  # separate x-gateway-key header instead. The gateway holds no credential of
  # its own here, so api_key must be empty.
  - model_name: anthropic-claude
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      # Keep this equal to model_name and request bodies are forwarded byte for
      # byte. Set it to a different upstream identifier and the gateway rewrites
      # exactly that one JSON value, leaving every other byte untouched.
      model: anthropic-claude
      auth_mode: passthrough
    weight: 10
    rpm: 1000
    # No `cost` here, and none is allowed: a passthrough deployment bills the
    # caller's own subscription, so pricing it would invent a charge the
    # operator never receives. Its traffic is reported as usage with no cost.

  # Deployment 2 — same public name, but billed to a server-side API key.
  # Requests overflow here when deployment 1 is rate limited or ejected.
  - model_name: anthropic-claude
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      model: claude-sonnet-4-5-20250929
      auth_mode: api_key
      auth_header: x-api-key
      api_key: ${ANTHROPIC_API_KEY}
    weight: 1
    rpm: 500
    # Priced per million tokens, as providers publish it. The cache figures
    # matter: Claude Code leans on prompt caching, and a cache read costs about
    # a tenth of ordinary input, so a cost model without them is badly wrong.
    cost:
      input_per_1m: 3.00
      output_per_1m: 15.00
      cache_read_per_1m: 0.30
      cache_write_per_1m: 3.75
      # Only needed where callers ask for the one-hour cache, which Anthropic
      # charges at 2x base input against the five-minute tier's 1.25x. Unset, it
      # falls back to cache_write_per_1m and the gateway warns the first time an
      # upstream reports a long write it cannot price.
      # cache_write_1h_per_1m: 6.00
      #
      # cache_writes_free replaces cache_write_per_1m on an Anthropic-compatible
      # upstream that is not Anthropic and charges nothing to write its cache —
      # Moonshot's /anthropic endpoint, for one. Without it such a deployment
      # cannot be priced at all: a write price is required on an anthropic
      # deployment and required above input, so every figure available would
      # invent a premium the invoice never shows, and the deployment would be
      # left unpriced reporting real billable traffic at zero. It also sharpens
      # an openai deployment, where an unset write price falls back to the input
      # rate rather than to zero.
      # cache_writes_free: true

  # A cheaper group to fall back to.
  - model_name: anthropic-claude-haiku
    params:
      format: anthropic
      api_base: https://api.anthropic.com
      model: claude-haiku-4-5-20251001
      auth_mode: api_key
      auth_header: x-api-key
      api_key: ${ANTHROPIC_API_KEY}
    weight: 1
    cost:
      input_per_1m: 1.00
      output_per_1m: 5.00
      cache_read_per_1m: 0.10
      cache_write_per_1m: 1.25

  # An OpenAI-format deployment, reachable at /v1/chat/completions. There is no
  # cross-format translation: an Anthropic ingress routes only to anthropic
  # deployments, and an OpenAI ingress only to openai ones.
  # An OpenAI-format upstream whose cache is explicit rather than automatic.
  # Alibaba's Qwen is the one that is: it reads Anthropic's cache_control marker
  # and caches the prefix up to it, with a higher hit ratio than the implicit
  # cache it otherwise falls back to. Most of this ecosystem is not like this,
  # so it is declared per deployment and never guessed. The explicit cache
  # charges for writes, so cost.cache_write_per_1m belongs on a deployment that
  # turns it on.
  # - model_name: qwen
  #   params:
  #     format: openai
  #     api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  #     model: qwen-max
  #     auth_mode: api_key
  #     auth_header: authorization
  #     auth_scheme: Bearer
  #     api_key: ${DASHSCOPE_API_KEY}
  #     supports_cache_control: true

  - model_name: gpt
    params:
      format: openai
      api_base: https://api.openai.com/v1
      model: gpt-5
      auth_mode: api_key
      auth_header: authorization
      auth_scheme: Bearer
      api_key: ${OPENAI_API_KEY}
    weight: 1
    # An OpenAI-compatible provider caches automatically and charges nothing to
    # write, so there is no write price here — but cache_read_per_1m is still
    # required, because its cached tokens arrive inside prompt_tokens and would
    # otherwise be billed as ordinary input.
    cost:
      input_per_1m: 1.25
      output_per_1m: 10.00
      cache_read_per_1m: 0.125

router:
  # weighted-shuffle | least-busy | usage-based | latency-based
  strategy: weighted-shuffle

  # Total upstream attempts is 1 + num_retries. A retry always moves to a
  # different deployment while an untried one is available.
  num_retries: 2

  timeout: 600s
  # For streaming requests this bounds time to the first chunk, not the whole
  # response, which may legitimately run for minutes.
  stream_timeout: 60s

  cooldown:
    # Failures tolerated within the period before a deployment is ejected.
    # 0 means eject on the first failure; the value always means what it says.
    allowed_fails: 3
    period: 30s

  # Backoff applies only when no untried deployment remains. With an
  # alternative available the router retries immediately.
  backoff:
    initial: 500ms
    max: 8s
    jitter: 0.75

  max_fallback_hops: 5
  fallbacks:
    - from: anthropic-claude
      to: [anthropic-claude-haiku]

  # Used by latency-based routing: widens the candidate set to every deployment
  # within this fraction of the best observed latency.
  lowest_latency_buffer: 0.2

virtual_keys:
  # Enables the /key/* management endpoints. Leave unset to disable them.
  master_key: ${GATEWAY_MASTER_KEY}

  # Where issued keys live. Only hashes are ever stored, whichever kind you
  # choose: the plaintext key exists once, in the response that issued it.
  #
  # memory   forgotten on restart. Fine when every key is declared below.
  # file     survives a restart, and is SINGLE-NODE. Two instances pointed at
  #          one path do not share it — each holds the whole set in memory and
  #          rewrites the file wholesale, so a key issued on one is erased by
  #          the next write from the other.
  # postgres shared by every replica, which is what makes /key/generate, an SSO
  #          login and a renewal work behind a load balancer. The gateway
  #          creates and migrates its own virtual_keys table at startup; there
  #          is no separate migration step.
  store:
    # memory | file | postgres
    #
    # Switching to postgres means replacing both lines below, not just the
    # first: a path left behind under kind: postgres is refused at load, the
    # same way a dsn left behind under kind: file is. Either way the config
    # would name a place the keys are not.
    kind: file
    path: ./data/keys.json

    # The dsn carries a password, so it comes from the environment: this file is
    # mounted read-only into containers and committed to repositories. Setting
    # it while kind is not postgres is refused at load rather than ignored,
    # since the keys would not be where one of the two lines says they are.
    #
    # Unlike redis, an unreachable key store is not degraded around: nothing can
    # be authenticated without it, and serving from a stale copy would keep
    # honouring keys you had just revoked. So the gateway refuses to start if
    # Postgres is unreachable at boot, and reports itself unready on
    # /health/readiness if it goes away later.
    #
    # dsn: ${KEY_STORE_DSN}   # postgres://gateway:...@db:5432/gateway?sslmode=require
    # timeout: 2s             # per query; longer than redis.timeout, which has a fallback
    # max_conns: 10           # pool size per gateway process

  # Headers that may carry a virtual key, in precedence order. These must not
  # collide with a header the client sets itself: the whole design depends on
  # the key travelling ALONGSIDE the caller's own credential rather than
  # replacing it. x-litellm-api-key is accepted for drop-in compatibility with
  # tooling already pointed at a LiteLLM proxy.
  header_names:
    - x-gateway-key
    - x-litellm-api-key

  # A passthrough deployment relays a caller credential, so its upstream host
  # must be listed here explicitly.
  allowed_upstream_hosts:
    - api.anthropic.com

  keys:
    - key: ${DEV_KEY}
      alias: dev-laptop
      models: ["anthropic-claude", "anthropic-claude-haiku"]
      rpm_limit: 200
      tpm_limit: 400000
      # Spend cap for the window below. Only billable traffic counts, so
      # subscription passthrough never consumes it.
      max_budget: 50.0
      budget_duration: 720h
      # Required before this key may reach a passthrough deployment.
      allow_passthrough: true
      # Put the key in a team, so its spend draws down that team's shared
      # budget as well as its own cap above. See the rbac block below.
      # scope: acme/platform

# ---------------------------------------------------------------------------
# rbac — organisations, teams and projects, so a budget can be a pool.
#
# Without this, keys are flat: every key carries its own max_budget and ten
# developers issued the same allowance can spend it ten times over. A scope is a
# subject in the ledger, not a template — every key beneath it records against
# the same entry, so its cap is one pool the members draw down together.
#
# Nesting is the hierarchy. The qualified id a key or an sso role names is built
# from it: acme, acme/platform, acme/platform/gateway.
#
# Entitlements narrow going down and never widen: a scope's models, rate limits
# and budget bind every key beneath it in addition to the key's own. A key
# naming a scope that is not declared here is refused rather than treated as
# unscoped, because the key store outlives this file.
# ---------------------------------------------------------------------------
# rbac:
#   organizations:
#     - id: acme
#       alias: Acme Inc
#       # The whole company's ceiling. Reached by every team's traffic together.
#       max_budget: 10000
#       budget_duration: 720h
#       models: ["anthropic-*"]
#
#       teams:
#         - id: platform
#           alias: Platform Engineering
#           # One pool the team shares, not an allowance each member receives.
#           max_budget: 2000
#           budget_duration: 720h
#           # Shared the same way: 600 requests a minute across the team.
#           rpm_limit: 600
#
#           projects:
#             - id: gateway
#               max_budget: 500
#               budget_duration: 720h
#
#         - id: contractors
#           # A narrower model list than the organisation above. It may narrow
#           # what its parent allows and never widen it; a child naming a model
#           # its parent withholds is refused at load.
#           models: ["anthropic-claude-haiku"]
#           max_budget: 250
#           budget_duration: 720h

# Share state across gateway instances. Without this every replica enforces its
# own limits, so a rate limit is silently multiplied by the replica count and a
# key can spend its whole budget once per instance.
#
# Rate limits, cooldowns and spend go to Redis because they must be global to be
# correct. Latency and in-flight stay per-instance by design: latency measures
# this instance's own network path to the upstream, and a shared in-flight
# counter would leak permanently whenever an instance died mid-request.
#
# If Redis becomes unreachable the gateway keeps serving with per-instance
# limits rather than failing requests, and says so loudly in the logs and on
# /health/readiness.
#
# An empty addr disables sharing, so this stays a single-instance gateway until
# REDIS_ADDR names a server. deploy/docker-compose.yml sets it.
redis:
  addr: ${REDIS_ADDR:-}
  key_prefix: ai-gateway
  timeout: 250ms

# Serve an identical request from a stored response instead of calling the
# provider again.
#
# scope decides who may see a cached response, and the default is deliberate.
# "key" confines each virtual key to its own responses: it cannot leak one
# caller's completion to another. "shared" lets every caller reuse any cached
# response — far larger savings, but only appropriate when all callers are
# equally trusted, and refused outright while any passthrough deployment exists,
# since those responses are generated under one person's own subscription.
# cache:
#   enabled: true
#   ttl: 5m
#   scope: key            # key | shared
#   max_entries: 1000
#   max_entry_bytes: 1048576
#   shared: false         # store in Redis so a hit on one instance serves all

# The provider's own prompt cache — the one Anthropic keeps of a request's
# leading tokens — as distinct from the response cache above.
#
# affinity is the part that matters behind a load balancer. A prompt cache lives
# on one upstream account, so spreading a conversation's turns across
# deployments turns every cache read into a cache write: a premium instead of a
# discount. Affinity pins requests that share a cacheable prefix to the
# deployment that last served one. It is a preference, never a constraint — a
# pinned deployment that is cooling down or at its rate limit is passed over as
# if there were no pin — and it does nothing at all in a group with a single
# deployment. On by default.
#
# inject places cache breakpoints on the stable prefix of an Anthropic request —
# the tools and the system prompt — for callers that do not place their own. Off
# by default. Which deployments it reaches is decided at dispatch: a passthrough
# deployment is never annotated, since it must forward the caller's body
# unchanged, and neither is one speaking another format. So a fleet holding both
# — the arrangement below — gets breakpoints on its API deployments while its
# subscription traffic is forwarded verbatim. Claude Code places its own
# breakpoints, so a body that already carries one is never touched.
prompt_cache:
  affinity: true
  affinity_ttl: 5m
  # Bounds how far a pin may concentrate load: it is passed over once the pinned
  # deployment carries this many more in-flight requests than the idlest
  # deployment that could serve the request instead. A load comparison rather
  # than a share quota, because concentration only hurts when there is
  # contention — one busy conversation among idle peers is the feature working.
  # 0 yields to any idler peer.
  affinity_max_in_flight_lead: 4
  # Mark an Anthropic request that carries no breakpoint of its own: the end of
  # the tools, the end of the system prompt, and the top-level cache_control
  # field that caches the conversation as it grows. A tool the gateway cannot
  # recognize as a custom one — a server tool, an MCP toolset — is left unmarked,
  # since the system breakpoint already caches every tool in the list.
  inject: false
  # Prompts smaller than this are left unmarked. Anthropic ignores a breakpoint
  # below its own minimum rather than rejecting it, so this is an economy rather
  # than a correctness rule. Measured over the tools, the system prompt and the
  # messages together, since the conversation is cached too.
  inject_min_bytes: 4096

# The admin console, served from this binary at /ui.
#
# It is off by default. The console lists every key, everyone signed in and what
# they spent, so it is an operator surface rather than something to expose
# alongside the inference API by omission. Enabling it requires a master key:
# signing in means presenting one, and the session it issues is scoped to /ui so
# the browser never attaches it to an inference request.
ui:
  enabled: false
  # How long a browser session lives. Short, because the session stands in for
  # the master key — anything the cookie can do, the master key can do. The
  # expiry is signed into the token rather than left to the cookie's Max-Age,
  # which is the browser's to decide.
  session_ttl: 12h
  # How many recently completed requests the console's traffic view can show.
  # Metadata only — no request or response body is ever retained — and held in
  # the process that served the traffic, so a fleet behind a load balancer shows
  # each instance its own slice rather than the whole. 0 keeps none.
  request_log_size: 1000

# The audit log: a tamper-evident record of administrative actions.
#
# Minting, editing and deleting a key, signing in and out of the console,
# issuing and renewing an SSO grant, purging the cache, and this process
# starting and stopping. Not inference — that is the access log's and the spend
# ledger's job, and per-request auditing would put an fsync on the hot path for
# traffic those two already describe.
#
# On by default, which is the opposite of `ui` above and deliberate: the default
# sink is stdout, so having the record costs nothing and creates nothing you did
# not ask for. A gateway that only records administration when asked is a
# gateway with no record on the one occasion anyone wants one, because that
# question is always asked afterwards.
#
# Every record carries the SHA-256 of the record before it and a sequence
# number, so a line altered or removed from the middle is detectable:
#
#   gateway -verify-audit ./data/audit.jsonl
#
# The write is synchronous, and a write that fails fails the action it was
# recording — a key that could not be audited is not minted. That is affordable
# precisely because inference is not audited here. See docs/audit.md.
audit:
  enabled: true
  # stdout | file | postgres
  #
  # stdout needs no path and introduces no failure the process's own logging
  # does not already have, but a writer cannot read back what it wrote: the
  # chain restarts at sequence 1 on every start, and continuity across restarts
  # is whatever collects your logs.
  #
  # file reads the existing chain at startup and continues it — on one host.
  # Two replicas pointed at one path do not share a chain, they keep two
  # unrelated ones, and on Kubernetes each lives on a filesystem that goes away
  # with the pod.
  #
  # postgres is one chain shared by every instance, and the only sink to run a
  # fleet with. See docs/audit.md.
  sink: stdout
  # Required by, and only meaningful to, the file sink. Written 0600 in a 0700
  # directory: the log names people and the keys they hold.
  # sink: file
  # path: ./data/audit.jsonl
  #
  # The shared chain. The table is created at startup and made append-only with
  # triggers that refuse UPDATE, DELETE and TRUNCATE; grant the gateway's role
  # INSERT and SELECT and nothing more. Prefer a different database from the key
  # store above: keys are current state, and these are evidence.
  # sink: postgres
  # dsn: ${GATEWAY_AUDIT_DSN}
  # timeout: 5s
  # max_conns: 4
  # Names this gateway in the records it writes. Defaults to the hostname, which
  # on Kubernetes is the pod name.
  # instance: gateway-a
  #
  # A chain that no longer verifies seals: the gateway starts and serves
  # inference, and refuses every administrative action until somebody archives
  # the chain. gateway_audit_sealed reports it. A sink that cannot be reached at
  # all is the other case, and stops the gateway starting.

observability:
  log_level: info
  # text | json
  log_format: text

  # Serve GET /metrics in the Prometheus text format. Unauthenticated, like the
  # liveness probe, but exposes only counters — no hostnames or auth modes.
  metrics: true

  # Push the same metrics to an OpenTelemetry collector.
  #
  # Independent of `metrics` above: either, both or neither may be on, and both
  # render one snapshot so they cannot disagree about a number. The reason to
  # add it is that OTLP is a push where Prometheus is a pull — a gateway that
  # cannot be scraped, because it is behind NAT or because it is one
  # short-lived member of an autoscaled group, has no way to publish a
  # pull-based metric at all.
  #
  # The standard OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS,
  # OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES variables are read wherever
  # this block is silent, so a collector sidecar that configures the rest of a
  # fleet configures this without a line here.
  # otlp:
  #   endpoint: http://localhost:4318
  #   # http/protobuf is what every collector accepts. http/json is the same
  #   # payload in a form you can read, which is worth having the first time a
  #   # collector rejects an export — but only some endpoints take it.
  #   protocol: http/protobuf
  #   interval: 60s
  #   # Must be below the interval, or a slow collector leaves exports
  #   # overlapping.
  #   timeout: 10s
  #   compress: true
  #   service_name: ai-gateway
  #   headers:
  #     x-api-key: ${OTLP_API_KEY}
  #   # Describe the process rather than the measurement, so they are sent once
  #   # per export rather than repeated on every data point.
  #   resource_attributes:
  #     deployment.environment: production

  # Persist the spend ledger so budgets survive a restart. Without it every
  # restart hands each key a fresh allowance.
  spend_store_path: ./data/spend.json
  spend_flush_interval: 30s

  # Ask OpenAI-compatible upstreams to report usage on streamed replies, by
  # adding stream_options.include_usage to a request that did not set
  # stream_options itself. Without it a streamed reply carries no usage at all,
  # so the request costs nothing, charges no budget and reports no cached
  # tokens — a plausible-looking zero that nothing else contradicts.
  #
  # The cost of asking is one extra chunk at the end of the stream, carrying the
  # usage and an empty choices array. It is part of the OpenAI protocol, but turn
  # this off for a hand-written client that indexes choices[0] on every chunk, or
  # for an upstream strict enough to reject the field. Anthropic is unaffected:
  # it reports usage on message_start whether asked or not.
  stream_usage: true

# ---------------------------------------------------------------------------
# SSO — a key per developer, with nothing to paste.
#
# With this configured, a developer runs "gateway login", authenticates against
# your identity provider in a browser, and their Claude Code settings are
# written for them. They never see the key. See docs/sso.md.
#
# The key still travels in ANTHROPIC_CUSTOM_HEADERS, which is the only channel
# that does not displace a claude.ai subscription login — so this is the SSO
# story that keeps the subscription, where distributing an apiKeyHelper would
# quietly move everyone onto per-token billing.
# ---------------------------------------------------------------------------
# sso:
#   issuer: https://example.okta.com
#   client_id: ${SSO_CLIENT_ID}
#   client_secret: ${SSO_CLIENT_SECRET}
#   # The gateway's own callback, and the only URI registered at the provider.
#   redirect_url: https://llm-gateway.example.com/sso/callback
#
#   # A key lives 30 days; the client renews inside the last 7. Renewing ahead
#   # of expiry is what keeps it invisible — the value a running session already
#   # read stays valid while the file is rewritten under it.
#   key_duration: 720h
#   renew_within: 168h
#
#   # Handed to clients. ANTHROPIC_MODEL is not optional: Claude Code skips
#   # model discovery when its only credential is a custom header.
#   base_url: https://llm-gateway.example.com
#   model: anthropic-claude
#
#   # Entitlements are declared here and never read from the token. A claim that
#   # could grant a model or raise a budget would make any claim-mapping mistake
#   # at the provider a privilege escalation here.
#   role_claim: groups
#   roles:
#     - match: platform-eng
#       models: ["anthropic-claude", "anthropic-claude-haiku"]
#       allow_passthrough: true      # required to reach the passthrough deployment
#       rpm_limit: 120
#       # Without a scope this is a cap EACH person matching the role receives,
#       # so a role covering ten developers permits ten times it. Naming a scope
#       # makes the team's budget the shared ceiling and leaves this as a
#       # per-person cap inside it. Both are enforced, innermost first.
#       max_budget: 200
#       budget_duration: 720h
#       scope: acme/platform
#
#     - match: contractors
#       models: ["anthropic-claude-haiku"]
#       max_budget: 25
#       budget_duration: 720h
#       scope: acme/contractors
#
#   # There is deliberately no "*" catch-all: an identity matching no role is
#   # refused, and a provider covering the whole company authenticates the whole
#   # company. Add one last only if that is what you mean.
#
#   # Accept the provider's own tokens on inference requests, as well as the
#   # keys a login issues.
#   #
#   # The trade is revocation against moving parts. An issued key is verified
#   # once at login and trusted until it expires, so disabling someone at the
#   # provider does not reach the gateway for up to key_duration. A token is
#   # verified on every request, so a suspended account stops working as soon as
#   # its current token does — usually within the hour. What it costs is that
#   # the caller must hold a live token and refresh it, which Claude Code cannot
#   # do while keeping a subscription login: its only credential channel that
#   # does not displace one is a static header.
#   #
#   # So this is for the callers a key does not suit — CI, a service, a script
#   # under a workload identity — and it sits beside the key path rather than
#   # replacing it. Both resolve through the roles above, and both account to
#   # the same person, so moving between them draws on one budget.
#   jwt_auth:
#     enabled: true
#     # The aud values a token may carry, defaulting to client_id — which is
#     # what an ID token carries. An access token minted for an API names that
#     # API instead, so list its identifier here. No wildcard: a token issued
#     # for another client of the same provider says nothing about this gateway.
#     audiences: ["api://ai-gateway"]
#     # How long a verified token is reused before it is checked again. Never
#     # past the token's own expiry. An explicit 0 means what it says: verify
#     # every request and cache nothing.
#     cache_ttl: 60s
